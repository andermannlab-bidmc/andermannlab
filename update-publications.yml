name: Update publications

on:
  schedule:
    - cron: "17 13 * * 1"   # every Monday morning (Boston time)
  workflow_dispatch:        # also adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add new papers from PubMed
        run: python scripts/update_publications.py
      - name: Save changes
        run: |
          git config user.name "publications-bot"
          git config user.email "publications-bot@users.noreply.github.com"
          git add data/publications.json
          git diff --cached --quiet || (git commit -m "Add new publications from PubMed" && git push)
